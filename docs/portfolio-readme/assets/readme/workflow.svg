<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 365" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><defs><marker id="m" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 4L0 8z" fill="#6B83A5"/></marker></defs><rect width="1080" height="365" rx="24" fill="#F6F9FD"/><text x="44" y="45" font-size="15" font-weight="750" fill="#2870C6">MATCHING / 03</text><text x="44" y="79" font-size="29" font-weight="750" fill="#112E56">요청에서 강습 확정까지</text><text x="44" y="105" font-size="16" font-weight="500" fill="#586E89">강사의 수락 자체가 강습 확정은 아닙니다. 강습생 확인과 결제 상태 반영이 이어집니다.</text><rect x="44" y="180" width="216" height="94" rx="14" fill="#E9F3FF" stroke="#0B58B1" stroke-opacity=".22"/><rect x="59" y="196" width="4" height="62" rx="2" fill="#0B58B1"/><text x="74" y="213" font-size="20" font-weight="750" fill="#0B58B1">01  요청</text><text x="74" y="237" font-size="15" font-weight="500" fill="#354D69">리조트 · 종목 · 참가자</text><rect x="293" y="180" width="216" height="94" rx="14" fill="#E9F3FF" stroke="#0B58B1" stroke-opacity=".22"/><rect x="308" y="196" width="4" height="62" rx="2" fill="#0B58B1"/><text x="323" y="213" font-size="20" font-weight="750" fill="#0B58B1">02  제안</text><text x="323" y="237" font-size="15" font-weight="500" fill="#354D69">후보 탐색 · 강사 수락</text><rect x="542" y="180" width="216" height="94" rx="14" fill="#FFF4E1" stroke="#895D13" stroke-opacity=".22"/><rect x="557" y="196" width="4" height="62" rx="2" fill="#895D13"/><text x="572" y="213" font-size="20" font-weight="750" fill="#895D13">03  확인</text><text x="572" y="237" font-size="15" font-weight="500" fill="#354D69">강습생 수락 · 결제</text><rect x="791" y="180" width="240" height="94" rx="14" fill="#ECF7F4" stroke="#087A69" stroke-opacity=".22"/><rect x="806" y="196" width="4" height="62" rx="2" fill="#087A69"/><text x="821" y="213" font-size="20" font-weight="750" fill="#087A69">04  확정</text><text x="821" y="237" font-size="15" font-weight="500"